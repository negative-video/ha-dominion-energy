name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

env:
  # Keep in sync with the ruff rev in .pre-commit-config.yaml.
  RUFF_VERSION: "0.16.2"
  # `dompower` is fetched from a GitHub release asset rather than PyPI, and
  # GitHub intermittently answers a release download with an HTTP/2
  # REFUSED_STREAM -- a refusal issued before the request is processed at all,
  # which RFC 7540 marks as safe to retry. uv's default three retries burned
  # through in 8.4 seconds and failed the job, discarding a ~575 MB Home
  # Assistant install that had already completed.
  #
  # Measured rather than assumed: the refusals arrive in bursts. During one,
  # two consecutive local runs failed while curl fetched the same asset over
  # HTTP/2 without complaint and GitHub reported all systems operational; a
  # few minutes later four runs passed with retries disabled entirely, at both
  # default and reduced download concurrency. So this is a transient edge
  # behaviour to ride out, not a load or concurrency problem to tune around --
  # which is why UV_CONCURRENT_DOWNLOADS is deliberately left alone.
  #
  # Eight retries with uv's exponential backoff spans a few minutes, enough to
  # outlast a burst. It costs nothing on the ordinary path: retries only
  # elapse when a download is already failing.
  UV_HTTP_RETRIES: "8"

jobs:
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Pinned to match .pre-commit-config.yaml. Left unpinned, a new Ruff
      # release can enable rules this repo has never seen and turn CI red with
      # no change here — which is exactly what had happened.
      # `tests/` is linted too: the suite is now a substantial part of this
      # repo, and it had quietly accumulated lint errors while unchecked.
      - name: Run Ruff linter
        run: uvx ruff@${{ env.RUFF_VERSION }} check custom_components/dominion_energy/ tests/

      - name: Run Ruff formatter check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check custom_components/dominion_energy/ tests/

  # Fast gate: the bulk of the suite is plain pytest over the standard library
  # and must stay runnable without Home Assistant installed. Running it on its
  # own keeps that property from silently rotting.
  test:
    name: Tests (no Home Assistant)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v

  # Full gate: runs everything, including the Home-Assistant-dependent tests
  # that the fast gate skips (most importantly the diagnostics redaction
  # tests). pytest-homeassistant-custom-component pins homeassistant==2026.8.1,
  # which requires Python 3.14.
  test-ha:
    name: Tests (Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra test-ha --python 3.14

      # Guard rail: the HA-dependent tests skip themselves when homeassistant
      # is missing, which would leave this job green while testing nothing.
      # Fail loudly here instead.
      - name: Verify Home Assistant is installed
        run: uv run --no-sync python -c "from homeassistant.const import __version__ as v; print('Home Assistant', v)"

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Type checking against the real target: the test-ha extra pins the exact
      # homeassistant release the integration ships against, so mypy sees the
      # same API surface as production. The previous job installed an
      # unpinned homeassistant on Python 3.12, which silently resolved to a
      # much older release.
      - name: Install dependencies
        run: uv sync --frozen --extra test-ha --extra typing --python 3.14

      - name: Run mypy
        run: uv run --no-sync mypy custom_components/dominion_energy/ --ignore-missing-imports
