repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^custom_components/dominion_energy/
        args: [--ignore-missing-imports]
        additional_dependencies:
          - homeassistant
          # The fork, not PyPI's `dompower`. Cloned rather than downloaded as a
          # release asset, matching pyproject.toml's [tool.uv.sources] and for
          # the same reason. Keep the tag in step with manifest.json's URL.
          - git+https://github.com/negative-video/dompower@v0.3.0
