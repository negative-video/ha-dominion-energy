repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^custom_components/dominion_energy/
        args: [--ignore-missing-imports]
        additional_dependencies:
          - homeassistant
          # The fork's release asset, not PyPI's `dompower`. Keep in step with
          # pyproject.toml's test-ha extra and with manifest.json.
          - https://github.com/negative-video/dompower/releases/download/v0.3.0/dompower-0.3.0-py3-none-any.whl
